*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}body{display:flex;align-items:center;justify-content:center;padding:24px;overflow-x:hidden}.error-page{width:min(900px,100%);min-height:calc(100vh - 48px);display:flex;align-items:center;justify-content:center;text-align:center}.error-card{width:100%;padding:56px 28px;border:1px solid var(--border);border-radius:28px;background:linear-gradient(180deg,rgba(255,255,255,.025),rgba(255,255,255,.01));box-shadow:0 24px 80px rgba(0,0,0,.28)}.brand{display:inline-flex;align-items:center;gap:10px;font-size:20px;font-weight:800;margin-bottom:28px}.brand-mark{display:grid;place-items:center;width:44px;height:44px;border-radius:12px;background:var(--purple);color:#fff;font-weight:900;font-size:21px;box-shadow:0 10px 30px rgba(108,85,255,.28)}.code{font-size:clamp(76px,16vw,150px);line-height:.9;font-weight:900;letter-spacing:-.07em;margin:0;background:linear-gradient(135deg,#fff,#7b67ff);-webkit-background-clip:text;background-clip:text;color:transparent}.error-card h1{font-size:clamp(28px,5vw,46px);margin:24px 0 12px;letter-spacing:-.03em}.error-card p{max-width:650px;margin:0 auto;color:var(--muted);font-size:17px;line-height:1.7}.actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:30px}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 20px;border-radius:12px;text-decoration:none;font-weight:800;border:1px solid var(--border);transition:transform .18s ease,box-shadow .18s ease,background .18s ease}.btn:hover{transform:translateY(-2px)}.btn-primary{background:var(--blue);color:#fff;box-shadow:0 10px 24px rgba(37,99,235,.25)}.btn-secondary{background:var(--surface);color:var(--text)}.hint{margin-top:24px!important;font-size:13px!important;color:#85879a!important}@media(max-width:520px){body{padding:14px}.error-page{mi <body><main class="error-page"><section aria-labelledby="error-title" class="error-card"><div class="brand"><span class="brand-mark">M</span><span>Meme<span style="color:#6c55ff">Studio</span></span></div><div aria-hidden="true" class="code">404</div><h1 id="error-title">Page not found</h1><p>The page you’re looking for doesn’t exist or may have moved. The 404 page is automatically used by GitHub Pages for missing URLs.</p><div class="actions"><a aria-label="Go to MemeStudio home" class="btn btn-primary" href="/" id="homeLink">← Go to Home</a><a class="btn btn-secondary" href="javascript:history.back()">Go Back</a></div><p class="hint">If you reached this page from a saved link, check the address and try again.</p></section></main><script>(function(){var a=document.getElementById('homeLink');if(!a)return;try{var path=location.pathname||'/';var parts=path.split('/').filter(Boolean);var root='/';if(location.hostname.endsWith('github.io')&&parts.length){root='/' + parts[0] + '/';}a.href=root;}catch(e){a.href='/';}})();</script></body></html>
